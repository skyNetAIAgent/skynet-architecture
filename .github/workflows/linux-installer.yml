name: Linux installer
on:
  push:
    paths: ["agent-go/**", "agent/v2/**", "installer/linux/**", "agent/install.sh", "tools/desktop_release.py", ".github/workflows/linux-installer.yml"]
  pull_request:
    paths: ["agent-go/**", "agent/v2/**", "installer/linux/**", "agent/install.sh", "tools/desktop_release.py", ".github/workflows/linux-installer.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bootstrap and installer tests
        run: |
          dash -n agent/install.sh
          python3 -IB -m unittest discover -s agent/tests -p test_linux_setup.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Check the Go module
        working-directory: agent-go
        run: |
          go vet -buildvcs=false ./...
          go test -buildvcs=false ./...
      - name: Verify the frozen Python bridge
        run: python3 -IB -c "import sys; sys.path.insert(0, 'agent'); from skynet_agent import updater; problems=updater.verify_installed('agent', exact=False); sys.exit(', '.join(problems) if problems else 0)"
      - name: Build the assets and verify the signed bundle
        run: |
          python3 tools/build_go.py --dir dist --seq "$(jq -er .seq agent/v2/release.json)" --version "$(jq -er .version agent/v2/release.json)"
          sh installer/linux/build.sh --dir dist
          dash -n installer/linux/skynet-agent-install.sh
      - name: Test the bundle offline
        run: |
          docker run --rm --network none --user 65534:65534 -e HOME=/tmp/home \
            -v "$PWD/installer/linux:/bundle:ro" debian:12-slim dash /bundle/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: skynet-agent-linux-installer
          path: installer/linux/skynet-agent-install.sh
