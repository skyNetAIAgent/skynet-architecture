name: Linux installer
on:
  push:
    paths: ["agent/**", "installer/linux/**", ".github/workflows/linux-installer.yml"]
  pull_request:
    paths: ["agent/**", "installer/linux/**", ".github/workflows/linux-installer.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SKYNET_PYTHON_SHA256_X86_64: ${{ vars.SKYNET_PYTHON_SHA256_X86_64 }}
      SKYNET_PYTHON_SHA256_AARCH64: ${{ vars.SKYNET_PYTHON_SHA256_AARCH64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Check shell and Linux setup tests
        run: |
          shellcheck -s sh agent/install.sh installer/linux/build.sh installer/linux/smoke.sh
          dash -n agent/install.sh
          python3 -I -m unittest discover -s agent/tests -p test_linux_setup.py
      - name: Build verified offline installer
        run: |
          sh installer/linux/build.sh
          dash -n installer/linux/skynet-agent-install.sh
      - name: Test without system Python on Debian
        run: |
          pin=$(jq -r '.x86_64_sha256 // empty' installer/linux/python.lock)
          mode=portable
          if [ -z "${pin:-$SKYNET_PYTHON_SHA256_X86_64}" ]; then
            echo "::warning::No x86_64 Python pin. Skipping portable installation and testing refusal."
            mode=unpinned
          fi
          docker run --rm --network none --user 65534:65534 -e HOME=/tmp/home \
            -v "$PWD/installer/linux:/bundle:ro" debian:12-slim dash /bundle/smoke.sh "$mode"
      - name: Test with system Python on Ubuntu
        run: |
          docker build -t skynet-ubuntu - <<'EOF'
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y --no-install-recommends python3
          EOF
          docker run --rm --network none --user 65534:65534 -e HOME=/tmp/home \
            -v "$PWD/installer/linux:/bundle:ro" skynet-ubuntu dash /bundle/smoke.sh system
      - uses: actions/upload-artifact@v4
        with:
          name: skynet-agent-linux-installer
          path: installer/linux/skynet-agent-install.sh
