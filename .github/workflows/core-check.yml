name: Foundation integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify CORE_HASHES.txt is unchanged since core-v1
        run: |
          # The hash list itself is pinned here; changing it is also a change of the foundation.
          echo "${CORE_HASHES_SHA256}  CORE_HASHES.txt" | sha256sum -c -
        env:
          CORE_HASHES_SHA256: e48003334f0df1b2db68c700039be4207932c6c224880554e51fbb9b018905cd
      - name: Verify every foundation file against CORE_HASHES.txt
        run: sha256sum -c CORE_HASHES.txt
