name: Windows installer

on:
  workflow_dispatch:
  push:
    paths:
      - "agent/v2/**"
      - "agent-go/**"
      - "tools/desktop_release.py"
      - "installer/windows/**"
      - ".github/workflows/windows-installer.yml"
  pull_request:
    paths:
      - "agent/v2/**"
      - "agent-go/**"
      - "tools/desktop_release.py"
      - "installer/windows/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve signed release bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Check the Go module
        working-directory: agent-go
        run: |
          go vet -buildvcs=false ./...
          go test -buildvcs=false ./...
      - name: Verify the frozen Python bridge
        run: python -IB -c "import sys; sys.path.insert(0, 'agent'); from skynet_agent import updater; problems=updater.verify_installed('agent', exact=False); sys.exit(', '.join(problems) if problems else 0)"
      - name: Build the signed release assets from source
        run: |
          $release = Get-Content -Raw agent/v2/release.json | ConvertFrom-Json
          python tools/build_go.py --dir dist --version $release.version --seq $release.seq
      - name: Verify and build
        run: ./installer/windows/build.ps1 -BuildDir build
      - name: Install, test and uninstall without system Python
        run: ./installer/windows/smoke.ps1 -BuildDir build
      - uses: actions/upload-artifact@v4
        with:
          name: SkyNetAgentSetup-x64
          path: |
            build/dist/SkyNetAgentSetup-*.exe
            build/dist/SkyNetAgentSetup-*.exe.sha256
          if-no-files-found: error
