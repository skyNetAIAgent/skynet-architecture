name: Windows installer

on:
  workflow_dispatch:
  push:
    paths:
      - "agent/**"
      - "installer/windows/**"
      - ".github/workflows/windows-installer.yml"
  pull_request:
    paths:
      - "agent/**"
      - "installer/windows/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve signed release bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Verify and build
        run: ./installer/windows/build.ps1 -BuildDir build
      - name: Install, test and uninstall without system Python
        run: ./installer/windows/smoke.ps1 -BuildDir build
      - uses: actions/upload-artifact@v4
        with:
          name: SkyNetAgentSetup-x64
          path: |
            build/dist/SkyNetAgentSetup-*.exe
            build/dist/SkyNetAgentSetup-*.exe.sha256
          if-no-files-found: error
