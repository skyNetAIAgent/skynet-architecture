plugins {
    id 'com.android.application'
}

android {
    namespace 'org.skynet.agent'
    compileSdk 34

    defaultConfig {
        applicationId 'org.skynet.agent'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '0.3.0'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libskynet.so']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}

def buildGoAgent = tasks.register('buildGoAgent', Exec) {
    workingDir rootDir
    commandLine 'bash', 'build-go.sh'
    inputs.file rootProject.file('build-go.sh')
    inputs.dir rootProject.file('../agent-go')
    outputs.files(['arm64-v8a', 'x86_64'].collect {
        file("src/main/jniLibs/${it}/libskynet.so")
    })
}

tasks.named('preBuild').configure { dependsOn buildGoAgent }
